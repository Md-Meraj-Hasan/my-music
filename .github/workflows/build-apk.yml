
name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose project files
        shell: bash
        run: |
          echo "===== REPOSITORY ROOT ====="
          pwd
          ls -la

          echo "===== SEARCHING PROJECT FILES ====="
          find . -maxdepth 5 -type f \( \
            -name package.json -o \
            -name package-lock.json -o \
            -name capacitor.config.json -o \
            -name index.html -o \
            -name strip-internet-permission.cjs \
          \) -print

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "ERROR: package.json is missing."
            echo "Add the project's package.json to the repository root."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing."
            exit 1
          fi

          if [ ! -f video-player.html ] || [ ! -d video-src ]; then
            echo "ERROR: embedded video player page/assets are missing."
            exit 1
          fi

          if [ ! -f scripts/strip-internet-permission.cjs ]; then
            echo "ERROR: Internet permission script is missing."
            exit 1
          fi

          if [ ! -f scripts/integrate-native-media.cjs ] || [ ! -f android-native/MediaPermissionPlugin.kt ] || [ ! -f android-native/MediaLibraryScannerPlugin.kt ] || [ ! -f android-native/MerajPlaybackService.kt ]; then
            echo "ERROR: Native media integration files are missing."
            exit 1
          fi

          echo "Project configuration verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle fallback for missing wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Verify built HTML and local assets
        run: node scripts/verify-web-assets.cjs dist

      - name: Regenerate a clean Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          # The repository's committed android/ folder is an old Jupyter/Chaquopy
          # project (package com.meraj.jupyternotebook), not a Capacitor project.
          # Reusing it leaves out the :capacitor-android project dependency, so
          # all com.getcapacitor.* Kotlin imports fail to resolve. Generate the
          # Android wrapper from the current package.json and capacitor.config.json.
          rm -rf android
          npx cap add android
          npx cap sync android

          # Capacitor 7 places the module include in capacitor.settings.gradle,
          # which is applied by settings.gradle. Check both files rather than
          # requiring the string to appear directly in settings.gradle.
          if ! grep -q "capacitor-android" android/settings.gradle android/capacitor.settings.gradle 2>/dev/null; then
            echo "ERROR: Generated Android project is missing the Capacitor Android module reference."
            echo "===== android/settings.gradle ====="
            cat android/settings.gradle
            echo "===== android/capacitor.settings.gradle ====="
            if [ -f android/capacitor.settings.gradle ]; then cat android/capacitor.settings.gradle; else echo "File not found"; fi
            exit 1
          fi
          if ! grep -q "capacitor-android" android/app/build.gradle; then
            echo "ERROR: App Gradle file does not reference the Capacitor Android module."
            cat android/app/build.gradle
            exit 1
          fi

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE="android/app/build.gradle"
          test -f "$APP_GRADLE"
          # Capacitor/AGP may configure Java for JVM 21 while Kotlin defaults to 17.
          # Explicitly align both compilers before native media integration/build.
          cat >> "$APP_GRADLE" <<'GRADLE'

          // Keep Java and Kotlin bytecode targets aligned for the GitHub Actions JDK 21.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "21"
              }
          }
          GRADLE
          echo "===== JVM TARGET CONFIGURATION ====="
          tail -n 22 "$APP_GRADLE"
          grep -q 'jvmTarget = "21"' "$APP_GRADLE"

      - name: Integrate native media permissions and scanner
        run: node scripts/integrate-native-media.cjs

      - name: Block internet permission
        run: node scripts/strip-internet-permission.cjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Re-apply internet permission block
        run: node scripts/strip-internet-permission.cjs

      - name: Verify Capacitor copied web assets
        run: node scripts/verify-web-assets.cjs android/app/src/main/assets/public

      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Android manifest not found."
            exit 1
          fi

          if ! grep -q 'tools:node="remove"' "$MANIFEST"; then
            echo "ERROR: INTERNET permission removal rule is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_MEDIA_AUDIO' "$MANIFEST"; then
            echo "ERROR: READ_MEDIA_AUDIO permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_MEDIA_VIDEO' "$MANIFEST"; then
            echo "ERROR: READ_MEDIA_VIDEO permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            echo "ERROR: Legacy media read permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          echo "Internet permission block plus audio/video permissions verified."

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing; generating it using the configured Gradle installation."
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper generation did not create android/gradlew."
            ls -la
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains its referenced web assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          python3 - "$APK" <<'PYVERIFY'
          import posixpath, re, sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              html_name = "assets/public/index.html"
              if html_name not in names:
                  raise SystemExit("APK is missing assets/public/index.html")
              html = z.read(html_name).decode("utf-8", "replace")
              refs = re.findall(r"""(?:src|href)=["']([^"']+)["']""", html)
              refs = [r for r in refs if not r.startswith(("http:", "https:", "data:", "//", "/"))]
              for ref in refs:
                  target = posixpath.normpath("assets/public/" + ref.split("?", 1)[0].lstrip("./"))
                  if target not in names:
                      raise SystemExit(f"APK HTML references missing asset: {target}")
              if not any(r.endswith(".js") for r in refs):
                  raise SystemExit("APK HTML has no local JavaScript bundle reference")
              print("APK web assets verified:", len(refs), "local references")
          PYVERIFY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meraj-media-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
